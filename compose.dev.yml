# Development override — run without rebuilding the image.
#
# Usage:
#   docker compose -f compose.yml -f compose.dev.yml up --build
#
# Source code is mounted live; Flask reloader picks up changes instantly.
# Rebuild only when uv.lock or pyproject.toml changes.
---
services:
  jncep-webui:
    image: jncep-webui:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    network_mode: host
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./logs:/logs
      - ./data:/data
      - ./downloads:/downloads
      - ./src:/app/src
    command: >
      uv run flask
      --app src.jncep_webui.app:app
      run
      --host 0.0.0.0
      --port 5000
      --debug
